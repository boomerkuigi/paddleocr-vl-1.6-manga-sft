[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paddleocr-vl-1-6-manga-sft"
version = "0.1.0"
description = "Reproducible PaddleOCR-VL 1.6 fine-tuning and evaluation for Japanese manga OCR"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
  "PyYAML>=6.0,<7",
  "Pillow>=10.4,<13",
  "numpy>=1.26,<3",
  "torch>=2.6,<2.7",
  "torchvision>=0.21,<0.22",
  "transformers>=5.0,<6",
  "accelerate>=1.6,<2",
  "huggingface-hub>=1.2,<2",
  "safetensors>=0.5,<1",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]
lora = ["peft>=0.18,<1"]
manga-ocr = ["manga-ocr==0.1.16"]

[tool.setuptools.packages.find]
where = ["."]
include = ["manga_sft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
